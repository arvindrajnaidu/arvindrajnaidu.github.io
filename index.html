<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>News Lens</title>
<meta name="description" content="Read the news without the clutter.">
<style>
  :root { --paper: #f3efe6; --card: #fbf9f4; --ink: #1d1b18; --muted: #6b6458; --amber: #e8a317; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #211f1c; --card: #2b2824; --ink: #ede8df; --muted: #b3ab9f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font: 17px/1.5 -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 460px; text-align: center; }
  h1 { font: 700 40px/1.1 Georgia, "Times New Roman", serif; margin: 0 0 12px; }
  p { margin: 0 0 28px; color: var(--muted); }
  a.get { display: inline-block; padding: 15px 28px; border-radius: 14px; background: var(--amber); color: #1d1b18;
    font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>News Lens</h1>
  <p>Open any news site, tap Filter, and read just the text you want, without the ads and clutter. Your filter is remembered for every page on that site.</p>
  <a class="get" href="https://apps.apple.com/app/id6828901858">Get News Lens</a>
</main>
</body>
</html>
